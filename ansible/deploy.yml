---
- name: Deploy CloudOps Dashboard
  hosts: cloudops
  become: true

  vars:
    app_dir: /opt/cloudops-dashboard

  tasks:
    - name: Wait for EC2 SSH
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - rsync
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy backend application files
      ansible.posix.synchronize:
        src: ../backend/
        dest: "{{ app_dir }}/backend/"
        delete: true
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=dist"
          - "--exclude=.env"
          - "--exclude=.env.*"

    - name: Copy frontend application files
      ansible.posix.synchronize:
        src: ../frontend/
        dest: "{{ app_dir }}/frontend/"
        delete: true
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=dist"
          - "--exclude=.env"
          - "--exclude=.env.*"

    - name: Ensure application ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: ubuntu
        group: ubuntu
        recurse: true

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Configure AWS deployment metadata
      ansible.builtin.copy:
        dest: "{{ app_dir }}/docker-compose.override.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
        content: |
          services:
            backend:
              environment:
                APP_ENVIRONMENT: production
                APP_VERSION: "1.0.0"
                DEPLOYED_BY: ansible
                CLOUD_PROVIDER: AWS
                CLOUD_REGION: eu-west-2
                INSTANCE_NAME: cloudops-dashboard-ec2
                NETWORK_NAME: cloudops-network

    - name: Configure public frontend port
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
        content: |
          FRONTEND_PORT=80

    - name: Build and start CloudOps containers
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"
      register: compose_result
      changed_when: true

    - name: Wait for CloudOps HTTP endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: health_check
      retries: 20
      delay: 3
      until: health_check.status == 200

    - name: Verify CloudOps API
      ansible.builtin.uri:
        url: http://127.0.0.1/api/dashboard
        return_content: true
        status_code: 200
      register: dashboard_api

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "CloudOps deployment successful"
          - "HTTP health status: {{ health_check.status }}"
          - "Dashboard status: {{ dashboard_api.json.status }}"
          - "Environment: {{ dashboard_api.json.deployment.environment }}"
          - "Provider: {{ dashboard_api.json.infrastructure.provider }}"